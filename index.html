<!DOCTYPE html>
<html>
<head>
    <title>Profil Saya Akhdan</title>
    <!-- Tag link ini berfungsi untuk menyambungkan HTML dengan file desain (CSS) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- SEMUA konten yang terlihat oleh pengunjung web harus diletakkan di dalam tag body ini -->
    
    <!-- Kotak atau wadah utama untuk profil Anda -->
    <div class="kartu-profil"> 
        
        <!-- Menampilkan foto profil -->
        <img src="cerita-06.jpg" alt="Foto Profil Saya">
        
        <!-- Judul atau Nama Anda -->
        <h1>AKHDAN ROSYID BAIHAQI</h1>
        
        <!-- Teks deskripsi / paragraf -->
        <p>Siswa SMK yang tertarik dengan teknologi dan desain. Selamat datang di profil saya.</p>
        
        <!-- Tautan (Link) menuju Instagram Anda -->
        <a href="https://www.instagram.com/akhdansyid/">Kunjungi Instagram Saya</a>
        <br><br> <!-- Baris baru agar ada sedikit jarak dengan tombol -->
        
        <!-- Tombol interaktif yang akan memicu JavaScript -->
        <button id="sapaButton">Sapa Saya!</button>
        
    </div>

    <!-- Tag script ini menyambungkan HTML dengan file interaksi (JavaScript). 
         Pastikan file JS Anda disimpan dengan nama 'script.js' -->
    <script src="script.js"></script>
</body>
</html>
